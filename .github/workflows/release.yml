name: Release

# One package per operating system. On Linux and Windows the CUDA platform is built as the
# runtime-loaded plugin (niftyreg_cuda), shipped next to the executables: the same binaries use
# the GPU where the CUDA runtime libraries and an NVIDIA driver are present and run CPU-only
# elsewhere (an explicit -platf 1 then fails with the loader's reason, never a silent fallback).
on:
  release:
    types: [published]
  # Dry run: builds and packages every asset as workflow artifacts without touching a release
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # Let every platform finish so one failure does not cancel the other assets
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            os-name: "Ubuntu"
            c-compiler: "gcc-12"
            cxx-compiler: "g++-12"
            build-all-dep: "ON"
            use-sse: "ON"
            use-cuda: "ON"
            cmake-extra: ""
          - os: windows-2022
            os-name: "Windows"
            c-compiler: "clang-cl"
            cxx-compiler: "clang-cl"
            build-all-dep: "ON"
            use-sse: "ON"
            use-cuda: "ON"
            cmake-extra: "-DCMAKE_CUDA_FLAGS=\"-allow-unsupported-compiler -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH\" -G Ninja"
          - os: macos-15-intel
            os-name: "macOS-Intel"
            c-compiler: "gcc-14"
            cxx-compiler: "g++-14"
            build-all-dep: "OFF"
            use-sse: "ON"
            use-cuda: "OFF"
            cmake-extra: ""
          - os: macos-15
            os-name: "macOS"
            c-compiler: "gcc-14"
            cxx-compiler: "g++-14"
            build-all-dep: "OFF"
            use-sse: "OFF"
            use-cuda: "OFF"
            cmake-extra: "-DCMAKE_C_FLAGS=-D__FLT_EVAL_METHOD__=0"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        if: matrix.os-name == 'Windows'

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@master
        if: matrix.use-cuda == 'ON'
        with:
          cuda: '11.8.0'
          method: network
          use-github-cache: false
          use-local-cache: false

      - name: Configure NiftyReg
        shell: bash
        run: |
          mkdir build && cd build
          cmake -DCMAKE_C_COMPILER=${{ matrix.c-compiler }} \
                -DCMAKE_CXX_COMPILER=${{ matrix.cxx-compiler }} \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_ALL_DEP=${{ matrix.build-all-dep }} \
                -DCHECK_GPU=OFF \
                -DUSE_CUDA=${{ matrix.use-cuda }} \
                -DUSE_CUDA_PLUGIN=${{ matrix.use-cuda }} \
                -DUSE_OPENCL=OFF \
                -DUSE_SSE=${{ matrix.use-sse }} \
                -DUSE_OPENMP=ON \
                -DBUILD_TESTING=OFF \
                ${{ matrix.cmake-extra }} \
                ..

      - name: Build NiftyReg
        shell: bash
        run: cmake --build build --config Release

      - name: Prepare the variables
        id: vars
        shell: bash
        # github.ref_name is the tag on a release event and the branch on a manual dry run
        run: echo "output-folder=NiftyReg-${{ matrix.os-name }}-${{ github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Prepare the package
        if: matrix.os-name == 'Windows'
        shell: powershell
        working-directory: build/reg-apps
        run: |
          New-Item -ItemType Directory -Force -Path ${{ steps.vars.outputs.output-folder }}
          Move-Item -Path *.exe -Destination ${{ steps.vars.outputs.output-folder }}
          Copy-Item -Path ../reg-lib/cuda/niftyreg_cuda.dll -Destination ${{ steps.vars.outputs.output-folder }}
          Copy-Item -Path "C:/Program Files/LLVM/bin/libomp.dll" -Destination ${{ steps.vars.outputs.output-folder }}/libomp140.x86_64.dll
          Compress-Archive -Path ${{ steps.vars.outputs.output-folder }} -DestinationPath ../NiftyReg.zip

      - name: Prepare the package
        if: matrix.os-name == 'Ubuntu'
        working-directory: build/reg-apps
        run: |
          mkdir -p ${{ steps.vars.outputs.output-folder }}
          find . -maxdepth 1 -type f -executable -exec mv {} ${{ steps.vars.outputs.output-folder }} \;
          cp ../reg-lib/cuda/libniftyreg_cuda.so ${{ steps.vars.outputs.output-folder }}
          zip -r ../NiftyReg.zip ${{ steps.vars.outputs.output-folder }}

      - name: Prepare the package
        if: startsWith(matrix.os-name, 'macOS')
        working-directory: build/reg-apps
        run: |
          mkdir -p ${{ steps.vars.outputs.output-folder }}
          find . -maxdepth 1 -type f -perm +111 -exec mv {} ${{ steps.vars.outputs.output-folder }} \;
          zip -r ../NiftyReg.zip ${{ steps.vars.outputs.output-folder }}

      - name: Keep the package as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.output-folder }}
          path: build/NiftyReg.zip

      - name: Upload the package to the release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ github.token }}
          file: build/NiftyReg.zip
          asset_name: ${{ steps.vars.outputs.output-folder }}.zip
